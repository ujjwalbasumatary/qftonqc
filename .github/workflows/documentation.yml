name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'python-docs/**'
      - 'index.md'
      - 'simulations/src/**'
      - 'course/tutorials/**'
      - 'course/examples/anharmonic-oscillator-spectrum/**'
      - '.github/workflows/documentation.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'python-docs/**'
      - 'index.md'
      - 'simulations/src/**'
      - 'course/tutorials/**'
      - 'course/examples/anharmonic-oscillator-spectrum/**'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - name: Install Julia documentation packages
        run: julia --startup-file=no --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build Julia tutorial
        run: julia --startup-file=no --project=docs docs/make.jl
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python documentation tools
        run: python -m pip install -r python-docs/requirements.txt
      - name: Build Python tutorial from saved notebooks
        run: sphinx-build -c python-docs -b dirhtml -d _build/doctrees -W --keep-going . _build/html
      - name: Assemble both sites
        run: |
          mkdir -p _site/python
          cp -a docs/build/. _site/
          cp -a _build/html/. _site/python/
          touch _site/.nojekyll
      - name: Upload website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
